<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Masked operator">
  <!-- Original artwork for the Knockout tab: a hooded operator in a skull balaclava. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2a6f86" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#123040" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3744"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2630"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ebee"/>
      <stop offset="1" stop-color="#9aa6ae"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bdf6ff"/>
      <stop offset=".35" stop-color="#19e3ff"/>
      <stop offset="1" stop-color="#19e3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="900" fill="url(#glow)"/>

  <!-- shoulders and vest -->
  <path d="M40 900 C60 790 120 720 230 690 L330 650 C360 690 440 690 470 650 L570 690 C680 720 740 790 760 900 Z" fill="url(#torso)"/>
  <path d="M230 690 L330 650 C345 700 365 740 380 900 L250 900 C250 820 245 750 230 690 Z" fill="#0f151c"/>
  <path d="M570 690 L470 650 C455 700 435 740 420 900 L550 900 C550 820 555 750 570 690 Z" fill="#0f151c"/>
  <rect x="268" y="760" width="86" height="58" rx="6" fill="#1a232d" stroke="#2c3946" stroke-width="3"/>
  <rect x="446" y="760" width="86" height="58" rx="6" fill="#1a232d" stroke="#2c3946" stroke-width="3"/>
  <rect x="282" y="834" width="60" height="40" rx="5" fill="#1a232d" stroke="#2c3946" stroke-width="3"/>
  <rect x="458" y="834" width="60" height="40" rx="5" fill="#1a232d" stroke="#2c3946" stroke-width="3"/>
  <path d="M150 760 C190 730 220 720 245 718" stroke="#2c3946" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M650 760 C610 730 580 720 555 718" stroke="#2c3946" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- hood -->
  <path d="M232 580 C200 400 270 205 400 198 C530 205 600 400 568 580 C545 650 480 690 400 694 C320 690 255 650 232 580 Z" fill="url(#hood)"/>
  <path d="M232 580 C200 400 270 205 400 198 C530 205 600 400 568 580" fill="none" stroke="#19e3ff" stroke-opacity=".35" stroke-width="4"/>

  <!-- balaclava -->
  <path d="M292 430 C290 320 340 272 400 272 C460 272 510 320 508 430 C506 540 462 612 400 622 C338 612 294 540 292 430 Z" fill="#1c232b"/>

  <!-- skull print -->
  <g fill="url(#bone)">
    <path d="M318 400 C318 330 356 300 400 300 C444 300 482 330 482 400 C482 440 470 462 456 476 L344 476 C330 462 318 440 318 400 Z" opacity=".92"/>
    <path d="M344 486 L456 486 C452 540 432 586 400 596 C368 586 348 540 344 486 Z" opacity=".92"/>
  </g>
  <!-- eye sockets -->
  <path d="M336 392 C340 366 362 356 384 364 C392 376 392 398 384 414 C366 424 344 418 336 392 Z" fill="#0b0f14"/>
  <path d="M464 392 C460 366 438 356 416 364 C408 376 408 398 416 414 C434 424 456 418 464 392 Z" fill="#0b0f14"/>
  <circle cx="364" cy="392" r="16" fill="url(#eye)"/>
  <circle cx="436" cy="392" r="16" fill="url(#eye)"/>
  <!-- nose -->
  <path d="M400 426 C392 440 386 452 392 460 C396 458 398 456 400 452 C402 456 404 458 408 460 C414 452 408 440 400 426 Z" fill="#0b0f14"/>
  <!-- teeth -->
  <g stroke="#0b0f14" stroke-width="3.5" stroke-linecap="round">
    <path d="M352 481 L448 481"/>
    <path d="M364 470 L364 500 M380 468 L380 504 M400 466 L400 506 M420 468 L420 504 M436 470 L436 500"/>
    <path d="M360 528 C380 540 420 540 440 528"/>
  </g>

  <!-- headset -->
  <ellipse cx="288" cy="440" rx="26" ry="40" fill="#141a21" stroke="#2c3946" stroke-width="4"/>
  <path d="M296 476 C318 540 350 566 380 572" stroke="#2c3946" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="384" cy="572" r="9" fill="#19e3ff" opacity=".7"/>
</svg>
