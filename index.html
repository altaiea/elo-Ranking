<!DOCTYPE html>
<html lang="en" class="layout-side theme-ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1100">
    <title>Elo Leaderboard</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preload" href="wings.webp" as="image">
    <link rel="modulepreload" href="js/main.js">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="matchSetup.css">
    <link rel="stylesheet" href="layout.css">
<style>
#bootLoader{position:fixed;inset:0;z-index:2147483000;background:#0b0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#e8edf3;font-family:sans-serif;transition:opacity .45s}
#bootLoader.done{opacity:0;pointer-events:none}
#bootLoader .bl-title{font:800 22px/1 sans-serif;letter-spacing:.2em}
#bootLoader .bl-bar{width:320px;max-width:70vw;height:6px;border-radius:3px;background:#1d2530;overflow:hidden}
#bootLoader .bl-fill{height:100%;width:0;background:#39ff6a;box-shadow:0 0 12px #39ff6a;transition:width .25s}
#bootLoader .bl-pct{font:700 13px/1 sans-serif;letter-spacing:.12em;color:#8a929e}
</style>
</head>

<body>
<div id="bootLoader"><div class="bl-title">LOADING</div><div class="bl-bar"><div class="bl-fill" id="blFill"></div></div><div class="bl-pct" id="blPct">0%</div></div>

<!-- ============================
     SIDE MENU (a bar along the bottom on phones)
============================ -->
<aside class="rail" id="rail">
    <div class="rail-brand"><span class="rail-logo">ELO</span></div>
    <nav id="tabs" role="tablist">
        <button class="nav-tab" data-tab="leaderboardPage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg><span class="nl">Leaderboard</span><span class="ns">Ranks</span></button>
        <button class="nav-tab" data-tab="teamsPage"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5.5"/></svg><span class="nl">Teams &amp; Maps</span><span class="ns">Teams</span></button>
        <button class="nav-tab" data-tab="historyPage"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nl">History</span><span class="ns">History</span></button>
        <button class="nav-tab" data-tab="comparisonsPage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l7 7M4 4v4M4 4h4M20 20l-7-7M20 20v-4M20 20h-4M20 4l-6 6M4 20l6-6"/></svg><span class="nl">Head-To-Head</span><span class="ns">H2H</span></button>
        <button class="nav-tab" data-tab="carouselPage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M17 7l3 1-3.5 12-2.5-.7"/></svg><span class="nl">Cards</span><span class="ns">Cards</span></button>
        <button class="nav-tab" data-tab="knockoutPage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3h4A4.5 4.5 0 0 1 19 7.5V12a4 4 0 0 1-4 4h-4.5A3.5 3.5 0 0 1 7 12.5V6.5A3.5 3.5 0 0 1 10.5 3z"/><path d="M7 8.5H6A2 2 0 0 0 4 10.5v1A2.5 2.5 0 0 0 6.5 14H7.5"/><path d="M11 7.5c1.5-.6 3.5-.6 5 .3"/><path d="M9.5 16v4.5h7.5V16M9.5 18.3h7.5"/></svg><span class="nl">Knockout</span><span class="ns">Knockout</span></button>
    </nav>
</aside>

<main class="shell" id="shell">

<!-- page header: tabs.js fills it for the open tab -->
<header class="page-head" id="pageHead">
    <h1 class="ph-title" id="pageTitle">LEADERBOARD</h1>
</header>

<!-- ============================
     LEADERBOARD TAB
============================ -->
<div id="leaderboardPage" class="tab-page">

    <div class="leaderboard-toolbar">
        <div class="toggle-container">
            <label class="switch small-switch">
                <input type="checkbox" id="toggleInactive">
                <span class="slider small-slider"></span>
            </label>
            <span class="toggle-label">Show Inactive Players</span>
        </div>
        <button id="monthlyRankingsButton" class="monthly-rankings-button" type="button">Monthly Rankings</button>
    </div>

    <table id="leaderboard">
        <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Elo</th>
            <th>W/L</th>
            <th>Total K/D</th>
        </tr>
        </thead>
        <tbody id="table-body"><tr><td colspan="5" class="leaderboard-message">Loading…</td></tr></tbody>
    </table>

</div>

<div id="teamsPage" class="tab-page">
  <div class="ms" id="matchSetup">

    <!-- STEP 1: PLAYERS -->
    <section class="ms-card">
      <header class="ms-head">
        <span class="ms-step">1</span>
        <div class="ms-head-text">
          <h2>Pick players</h2>
        </div>
        <span class="ms-count" id="msCount">0/8</span>
      </header>

      <div class="ms-seg" role="tablist" id="msModeSeg">
        <button class="on" data-mode="auto" type="button">Auto balance</button>
        <button data-mode="manual" type="button">Pick teams</button>
      </div>

      <div class="ms-addto" id="msAddTo" hidden>
        <button class="ms-addto-btn a on" data-team="A" type="button">Team A <b>0/4</b></button>
        <button class="ms-addto-btn b" data-team="B" type="button">Team B <b>0/4</b></button>
      </div>

      <div class="ms-grid" id="msPlayers"></div>

      <div class="ms-row">
        <button class="ms-link" id="msInactive" type="button">Show inactive</button>
        <button class="ms-link" id="msClear" type="button">Clear</button>
      </div>

      <div class="ms-dock">
        <button class="ms-go" id="msBuild" type="button" disabled>Pick 8 players</button>
      </div>

    </section>

    <!-- STEP 2: MAPS -->
    <section class="ms-card">
      <header class="ms-head">
        <span class="ms-step">2</span>
        <div class="ms-head-text">
          <h2>Roll maps</h2>
        </div>
      </header>
      <div class="ms-seg ms-seg-3" id="msSeriesSeg">
        <button data-count="5" type="button">Bo5</button>
        <button class="on" data-count="7" type="button">Bo7</button>
        <button data-count="9" type="button">Bo9</button>
      </div>
      <button class="map-series-btn ms-roll" id="msRoll" type="button">Generate</button>
      <div id="mapLoading" class="map-loading" style="display:none;"><div class="spinner"></div></div>
      <div id="mapSeriesOut" class="map-series-output"></div>
    </section>

  </div>
</div>

<!-- ============================
     MAP HISTORY TAB (duo network, then days by week)
============================ -->
<div id="historyPage" class="tab-page">

    <div id="historyList"></div>
    <div id="historyViewer" class="history-viewer"></div>

</div>

<!-- ============================
      COMPARISONS TAB
============================ -->
<div id="comparisonsPage" class="tab-page">
    <section class="comparison-page">
        <div class="comparison-header">
            <h2>HEAD-TO-HEAD</h2>
            <p>Who's Better?</p>
        </div>

        <div class="comparison-selectors">
            <div class="comparison-player-box">
                <label for="comparePlayerA">PLAYER 1</label>
                <select id="comparePlayerA" class="comparison-select">
                    <option value="">Select player</option>
                </select>
            </div>

            <div class="comparison-vs">VS</div>

            <div class="comparison-player-box">
                <label for="comparePlayerB">PLAYER 2</label>
                <select id="comparePlayerB" class="comparison-select">
                    <option value="">Select player</option>
                </select>
            </div>
        </div>

        <div id="comparisonEmpty" class="comparison-empty">Select two players to begin.</div>
        <div id="comparisonContent" class="comparison-content" style="display:none;"></div>
    </section>
</div>

<!-- ============================
       CARDS TAB PAGE (CAROUSEL)
============================ -->
<div id="carouselPage" class="tab-page">
    <h2 style="text-align:center; color:#00eaff;"></h2>

    <div id="carouselContainer">
        <div class="banner">
            <div class="card-particle-layer" aria-hidden="true"></div>
            <!-- The cards are added by js/carousel.js from the player list in js/config.js -->
            <div class="slider"></div>
        </div>
    </div>
</div>

<!-- ============================
       KNOCKOUT TAB (Captain's Cup, js/knockout.js)
============================ -->
<div id="knockoutPage" class="tab-page">
    <section class="ko-poster">
        <div class="ko-art" aria-hidden="true"></div>
        <div class="ko-top">
            <div class="ko-title">
                <div class="ko-kicker">4V4 · Captain's Cup</div>
                <h2 class="ko-h"><span id="koMonthName">November 2026</span><em>Knockout stage</em></h2>
                <p class="ko-q">Who's the best 9-map captain in each tier?</p>
                <p class="ko-small" id="koSeededFrom"></p>
                <label class="ko-month">Month <select id="koMonthSelect"></select></label>
            </div>
            <aside class="ko-standings" id="koStandings" aria-label="Monthly rankings used for the seeds"></aside>
        </div>
        <div class="ko-cards-bar">
            <button type="button" id="koCardsButton" class="ko-cards-btn" aria-expanded="false" aria-controls="koCards">Knock-out Cards</button>
            <button type="button" id="koRulesButton" class="ko-cards-btn ko-rules-btn" aria-expanded="false" aria-controls="koRules">Rules</button>
            <button type="button" id="koHistoryButton" class="ko-cards-btn ko-rules-btn" aria-expanded="false" aria-controls="koHistory">History</button>
        </div>
        <div id="koRules" class="ko-rules-panel" hidden></div>
        <div id="koHistory" class="ko-rules-panel ko-history-panel" hidden></div>
        <div id="koCards" class="ko-cards" hidden></div>
        <div id="koTiers"></div>
    </section>
</div>

</main>

<!-- ============================
     MAIN PLAYER MODAL
============================ -->
<div id="playerModal" class="modal">


    <div class="modal-content">
        <span id="closeModal" class="close"></span>

        <div class="card-contents-wrapper">
            <div class="container">

                <!--  THIS IS NOW THE SAME CARD USED BY ALL PLAYERS  -->
                <div class="card">

                    <!-- FRONT FACE -->
                    <div class="front"></div>

                    <!-- BACK FACE (NOW SAME FOR ALL PLAYERS) -->
                    <div class="back">

                        <!--  VIDEO NOW LIVES HERE WITH ALL OTHER BACK CONTENT  -->
                        <video id="cardBackVideo" class="card-back-video" preload="none" muted playsinline></video>


                        <!-- CARD LAYERS -->
                        <img class="card-layer layer1">
                        <img class="card-layer layer2">
                        <img class="card-layer layer3">
                        <img class="card-layer layer4">
                        <img class="card-layer layer5">
                        <img class="card-layer layer6">
                        <img class="card-layer layer7">
                        <img class="card-layer layer8">
                        <img class="card-layer layer9">
                        <img class="card-layer layer10">
                        <img class="card-layer layer11">

                        <!-- CIRCLES -->
                        <span class="col1 row1 circle-row1"></span>
                        <span class="col2 row1 circle-row1"></span>
                        <span class="col3 row1 circle-row1"></span>

                        <!-- RATING -->
                        <div class="date-box">
                            <div class="rating"></div>
                        </div>

                    </div> <!-- end back -->

                </div> <!-- end card -->

            </div> <!-- end container -->
        </div> <!-- end card-contents-wrapper -->

    </div> <!-- end modal-content -->

</div> <!-- end playerModal -->


<!-- ============================
     MODE STATS PANEL (wheel design)
============================ -->
<div id="modeModal" class="modal" aria-hidden="true">
    <div class="mp-panel" id="modePanel" role="dialog" aria-modal="true" aria-label="Mode stats"></div>
</div>





<div id="popupOverlay" class="popup-overlay"></div>

<div id="popupCard" class="popup-card">
    <button id="popupClose" class="popup-close">×</button>
    <div id="popupContent"></div>
</div>



<script type="module" src="script.js"></script>
</body>
</html>
