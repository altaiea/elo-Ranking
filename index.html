<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elo Leaderboard</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preload" href="wings.png" as="image">
    <link rel="preload" href="CDLcardUse.png" as="image">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 id="pageTitle">LEADERBOARD</h1>

<!-- ============================
     TAB BAR
============================ -->
<div id="tabs">
    <button class="nav-tab" data-tab="leaderboardPage">Leaderboard</button>
    <button class="nav-tab" data-tab="teamsPage">Teams</button>
    <button class="nav-tab" data-tab="seriesHistoryPage">History</button>
    <button class="nav-tab" data-tab="codleticPage">Codletic</button>
    <button class="nav-tab" data-tab="mapsPage">Maps</button>
    <button class="nav-tab" data-tab="carouselPage">Cards</button>
</div>

<!-- ============================
     LEADERBOARD TAB
============================ -->
<div id="leaderboardPage" class="tab-page">

    <div class="toggle-container">
        <label class="switch small-switch">
            <input type="checkbox" id="toggleInactive">
            <span class="slider small-slider"></span>
        </label>
        <span class="toggle-label">Show Inactive Players</span>
    </div>

    <table id="leaderboard">
        <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Elo</th>
            <th>W/L</th>
            <th>Total K/D</th>
        </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

</div>

<div id="teamsPage" class="tab-page">

    <h2 style="text-align:center; color:#00eaff;">Generate Teams</h2>

    <div class="teams-container">

        <!-- AUTO TEAM BUILDER -->
        <div class="team-panel">
            <button class="team-toggle" data-target="autoPanel">Auto Team ▼</button>

            <div id="autoPanel" class="team-content">
                <p>Select 8 players:</p>

                <div class="player-select-grid">
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                    <select class="team-player"></select>
                </div>

                <button id="generateTeams" class="generate-teams-btn">
                    Best Match-Up
                </button>

                <!--  Strength Bars (with percentage text) -->
                <div class="team-strength-wrapper">
                    <div class="team-strength">
                        <span>Team A Strength</span>
                        <div class="strength-bar">
                            <div id="strengthA" class="strength-fill">
                                <span id="strengthAText" class="strength-text"></span>
                            </div>
                        </div>
                    </div>

                    <div class="team-strength">
                        <span>Team B Strength</span>
                        <div class="strength-bar">
                            <div id="strengthB" class="strength-fill">
                                <span id="strengthBText" class="strength-text"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MANUAL TEAM BUILDER -->
        <div class="team-panel">
            <button class="team-toggle" data-target="manualPanel">Manual team ▼</button>

            <div id="manualPanel" class="team-content">

                <div class="manual-team-block">
                    <h4 class="team-label">Team A</h4>
                    <div class="player-select-grid">
                        <select class="manualA manual-select"></select>
                        <select class="manualA manual-select"></select>
                        <select class="manualA manual-select"></select>
                        <select class="manualA manual-select"></select>
                    </div>
                </div>

                <div class="manual-team-block">
                    <h4 class="team-label">Team B</h4>
                    <div class="player-select-grid">
                        <select class="manualB manual-select"></select>
                        <select class="manualB manual-select"></select>
                        <select class="manualB manual-select"></select>
                        <select class="manualB manual-select"></select>
                    </div>
                </div>

                <button id="simulateMatchBtn" class="generate-teams-btn" style="display:none;">
                    Simulate Match
                </button>

                <!-- Strength Bars (with percentage text) -->
                <div class="team-strength-wrapper">
                    <div class="team-strength">
                        <span>Team A Strength</span>
                        <div class="strength-bar">
                            <div id="manualStrengthA" class="strength-fill">
                                <span id="manualStrengthAText" class="strength-text"></span>
                            </div>
                        </div>
                    </div>

                    <div class="team-strength">
                        <span>Team B Strength</span>
                        <div class="strength-bar">
                            <div id="manualStrengthB" class="strength-fill">
                                <span id="manualStrengthBText" class="strength-text"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

</div>

<!-- ============================
      MAPS TAB PAGE
============================ -->
<div id="mapsPage" class="tab-page">

    <h2 style="text-align:center; color:#00eaff;">Maps</h2>

    <!--loading spinner -->
    <div id="mapLoading" class="map-loading" style="display:none;">
        <div class="spinner"></div>
    </div>

    <div class="maps-container">

        <div class="map-series-block">
            <div class="map-series-header">
                <span class="map-series-title">5‑Map Series</span>
                <button class="map-series-btn" data-count="5">Generate</button>
            </div>
            <div id="mapSeries5" class="map-series-output"></div>
        </div>

        <div class="map-series-block">
            <div class="map-series-header">
                <span class="map-series-title">7‑Map Series</span>
                <button class="map-series-btn" data-count="7">Generate</button>
            </div>
            <div id="mapSeries7" class="map-series-output"></div>
        </div>

        <div class="map-series-block">
            <div class="map-series-header">
                <span class="map-series-title">9‑Map Series</span>
                <button class="map-series-btn" data-count="9">Generate</button>
            </div>
            <div id="mapSeries9" class="map-series-output"></div>
        </div>

    </div>

</div>


<!-- ============================
     SERIES HISTORY TAB
============================ -->
<div id="seriesHistoryPage" class="tab-page">

    <div id="seriesList"></div>
    <div id="seriesViewer" class="series-viewer"></div>

</div>

<!-- ============================
      CODLETIC TAB
============================ -->
<div id="codleticPage" class="tab-page">
    <article class="codletic-article">
        <h2>Codletic</h2>
        <p>Article Pending.</p>
    </article>
</div>

<!-- ============================
       CARDS TAB PAGE (CAROUSEL)
============================ -->
<div id="carouselPage" class="tab-page">
    <h2 style="text-align:center; color:#00eaff;"></h2>

    <div id="carouselContainer">
        <div class="banner">
            <div class="slider" style="--quantity: 14;">
                <!-- Cards unchanged -->
                <!-- (Your 14 card items remain exactly as you sent them) -->
                <div class="item" style="--position: 1">
                    <div class="card-face carousel-front"><img src="cards/1_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 2">
                    <div class="card-face carousel-front"><img src="cards/2_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 3">
                    <div class="card-face carousel-front"><img src="cards/3_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 4">
                    <div class="card-face carousel-front"><img src="cards/4_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 5">
                    <div class="card-face carousel-front"><img src="cards/5_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 6">
                    <div class="card-face carousel-front"><img src="cards/6_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 7">
                    <div class="card-face carousel-front"><img src="cards/7_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 8">
                    <div class="card-face carousel-front"><img src="cards/8_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 9">
                    <div class="card-face carousel-front"><img src="cards/9_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 10">
                    <div class="card-face carousel-front"><img src="cards/10_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 11">
                    <div class="card-face carousel-front"><img src="cards/11_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 12">
                    <div class="card-face carousel-front"><img src="cards/12_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 13">
                    <div class="card-face carousel-front"><img src="cards/13_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
                <div class="item" style="--position: 14">
                    <div class="card-face carousel-front"><img src="cards/14_back.png" alt=""></div>
                    <div class="card-face carousel-back"><img src="wings.png" alt=""></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ============================
     MAIN PLAYER MODAL
============================ -->
<div id="playerModal" class="modal">

    <div class="modal-content">
        <span id="closeModal" class="close"></span>

        <div class="card-contents-wrapper">
            <div class="container">

                <!--  THIS IS NOW THE SAME CARD USED BY ALL PLAYERS  -->
                <div class="card">

                    <!-- FRONT FACE -->
                    <div class="front"></div>

                    <!-- BACK FACE (NOW SAME FOR ALL PLAYERS) -->
                    <div class="back">

                        <!--  VIDEO NOW LIVES HERE WITH ALL OTHER BACK CONTENT  -->
                        <video id="cardBackVideo" class="card-back-video" preload="auto" muted playsinline>
                            <source src="cards/3_intro.mp4" type="video/mp4">
                        </video>


                        <!-- CARD LAYERS -->
                        <img class="card-layer layer1">
                        <img class="card-layer layer2">
                        <img class="card-layer layer3">
                        <img class="card-layer layer4">
                        <img class="card-layer layer5">
                        <img class="card-layer layer6">
                        <img class="card-layer layer7">
                        <img class="card-layer layer8">
                        <img class="card-layer layer9">
                        <img class="card-layer layer10">
                        <img class="card-layer layer11">

                        <!-- CIRCLES -->
                        <span class="col1 row1 circle-row1"></span>
                        <span class="col2 row1 circle-row1"></span>
                        <span class="col3 row1 circle-row1"></span>

                        <!-- RATING -->
                        <div class="date-box">
                            <div class="rating"></div>
                        </div>

                    </div> <!-- end back -->

                </div> <!-- end card -->

            </div> <!-- end container -->
        </div> <!-- end card-contents-wrapper -->

    </div> <!-- end modal-content -->

</div> <!-- end playerModal -->


<!-- ============================
     MODE STATS MODAL (PNG VERSION)
============================ -->
<div id="modeModal" class="modal">
    <div class="mode-modal-content">
        <img class="mode-shield" src="CircleC.png" alt="">

        <!-- INDIVIDUAL POSITIONABLE ELEMENTS -->
        <div id="modeTitleBox"></div>
        <div id="modeKDBox"></div>
        <div id="modeMarginBox"></div>
        <div id="modeSlayerBox"></div>
    </div>
</div>





<div id="popupOverlay" class="popup-overlay"></div>

<div id="popupCard" class="popup-card">
    <button id="popupClose" class="popup-close">×</button>
    <div id="popupContent"></div>
</div>



<script src="script.js"></script>
</body>
</html>
